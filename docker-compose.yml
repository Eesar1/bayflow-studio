services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bayflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bayflow_local}
      POSTGRES_DB: bayflow
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bayflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayflow"]
      interval: 5s
      retries: 10
volumes:
  bayflow_postgres:
